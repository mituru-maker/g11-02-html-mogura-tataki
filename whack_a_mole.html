<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-A-Mole Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --grass-color: #4ade80;
            --dirt-color: #92400e;
        }

        body {
            background-color: #f0fdf4;
            user-select: none;
            touch-action: manipulation;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .hole {
            position: relative;
            overflow: hidden;
            background: var(--dirt-color);
            border-radius: 50% / 20%;
            box-shadow: inset 0 10px 0 rgba(0,0,0,0.3);
            aspect-ratio: 1 / 0.8;
        }

        .mole {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 90%;
            background: #a855f7;
            border-radius: 50% 50% 10% 10%;
            transition: top 0.15s ease-out;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10%;
        }

        .mole.up {
            top: 15%;
        }

        .mole-eyes {
            display: flex;
            gap: 20%;
            width: 50%;
            margin-bottom: 5%;
        }

        .eye {
            width: 8px;
            height: 8px;
            background: black;
            border-radius: 50%;
        }

        .mole-nose {
            width: 12px;
            height: 8px;
            background: #f472b6;
            border-radius: 40%;
        }

        .mole.hit {
            background: #ef4444 !important;
            transform: translateX(-50%) scale(0.9);
        }

        .score-popup {
            position: absolute;
            color: #fbbf24;
            font-weight: bold;
            font-size: 1.5rem;
            pointer-events: none;
            animation: float-up 0.5s ease-out forwards;
            z-index: 20;
        }

        @keyframes float-up {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }

        /* ハンマーのカーソル（PC用） */
        .game-area {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 10l4.5 4.5L14.5 19l-4.5-4.5L14.5 10z"/><path d="M10 14.5l-6 6"/><path d="M12.5 8L16 4.5"/><path d="M8 12.5L4.5 16"/></svg>') 16 16, auto;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-6 text-center">
        <h1 class="text-3xl font-black text-green-600 mb-4">モグラたたき！</h1>
        
        <div class="flex justify-between mb-6 bg-gray-100 p-4 rounded-xl">
            <div>
                <p class="text-xs text-gray-500 uppercase font-bold">Score</p>
                <p id="score" class="text-3xl font-mono font-black text-blue-600">0</p>
            </div>
            <div>
                <p class="text-xs text-gray-500 uppercase font-bold">Time</p>
                <p id="timer" class="text-3xl font-mono font-black text-red-500">30</p>
            </div>
            <div>
                <p class="text-xs text-gray-500 uppercase font-bold">Combo</p>
                <p id="combo" class="text-3xl font-mono font-black text-orange-500">0</p>
            </div>
        </div>

        <div id="game-grid" class="game-area grid grid-cols-3 gap-4 mb-6">
            <!-- 9つの穴 -->
            <div class="hole"><div class="mole">
                <div class="mole-eyes"><div class="eye"></div><div class="eye"></div></div>
                <div class="mole-nose"></div>
            </div></div>
            <div class="hole"><div class="mole">
                <div class="mole-eyes"><div class="eye"></div><div class="eye"></div></div>
                <div class="mole-nose"></div>
            </div></div>
            <div class="hole"><div class="mole">
                <div class="mole-eyes"><div class="eye"></div><div class="eye"></div></div>
                <div class="mole-nose"></div>
            </div></div>
            <div class="hole"><div class="mole">
                <div class="mole-eyes"><div class="eye"></div><div class="eye"></div></div>
                <div class="mole-nose"></div>
            </div></div>
            <div class="hole"><div class="mole">
                <div class="mole-eyes"><div class="eye"></div><div class="eye"></div></div>
                <div class="mole-nose"></div>
            </div></div>
            <div class="hole"><div class="mole">
                <div class="mole-eyes"><div class="eye"></div><div class="eye"></div></div>
                <div class="mole-nose"></div>
            </div></div>
            <div class="hole"><div class="mole">
                <div class="mole-eyes"><div class="eye"></div><div class="eye"></div></div>
                <div class="mole-nose"></div>
            </div></div>
            <div class="hole"><div class="mole">
                <div class="mole-eyes"><div class="eye"></div><div class="eye"></div></div>
                <div class="mole-nose"></div>
            </div></div>
            <div class="hole"><div class="mole">
                <div class="mole-eyes"><div class="eye"></div><div class="eye"></div></div>
                <div class="mole-nose"></div>
            </div></div>
        </div>

        <button id="start-btn" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-8 rounded-2xl transition-all transform active:scale-95 text-xl shadow-lg">
            ゲームスタート！
        </button>

        <div id="message-box" class="hidden mt-4 p-3 bg-blue-100 text-blue-800 rounded-lg font-bold">
            <!-- Messages go here -->
        </div>
    </div>

    <script>
        const holes = document.querySelectorAll('.hole');
        const moles = document.querySelectorAll('.mole');
        const scoreBoard = document.querySelector('#score');
        const timerBoard = document.querySelector('#timer');
        const comboBoard = document.querySelector('#combo');
        const startBtn = document.querySelector('#start-btn');
        const messageBox = document.querySelector('#message-box');

        let lastHole;
        let timeUp = false;
        let score = 0;
        let timeLeft = 30;
        let timerId;
        let combo = 0;
        let moleTimeout;

        // ランダムな時間を生成
        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        // ランダムな穴を選択（同じ穴が連続しないようにする）
        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) {
                return randomHole(holes);
            }
            lastHole = hole;
            return hole;
        }

        // モグラを出す
        function peep() {
            // 残り時間に応じて速さを変える
            const difficulty = timeLeft > 20 ? [800, 1200] : (timeLeft > 10 ? [500, 1000] : [300, 700]);
            const time = randomTime(difficulty[0], difficulty[1]);
            const hole = randomHole(holes);
            const mole = hole.querySelector('.mole');
            
            mole.classList.remove('hit');
            mole.classList.add('up');

            moleTimeout = setTimeout(() => {
                mole.classList.remove('up');
                if (!timeUp) {
                    // モグラを叩けなかったらコンボ終了
                    if (!mole.classList.contains('hit')) {
                        updateCombo(0);
                    }
                    peep();
                }
            }, time);
        }

        function updateCombo(newCombo) {
            combo = newCombo;
            comboBoard.textContent = combo;
            if (combo > 5) comboBoard.classList.add('animate-bounce');
            else comboBoard.classList.remove('animate-bounce');
        }

        function startGame() {
            // 初期化
            score = 0;
            timeLeft = 30;
            timeUp = false;
            updateCombo(0);
            scoreBoard.textContent = 0;
            timerBoard.textContent = timeLeft;
            startBtn.disabled = true;
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');
            messageBox.classList.add('hidden');

            // タイマー開始
            timerId = setInterval(() => {
                timeLeft--;
                timerBoard.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    endGame();
                }
            }, 1000);

            peep();
        }

        function endGame() {
            timeUp = true;
            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            startBtn.textContent = 'もう一度プレイ';
            
            messageBox.textContent = `終了！最終スコア: ${score}点 (最大コンボ: ${combo})`;
            messageBox.classList.remove('hidden');
        }

        function whack(e) {
            if (!e.isTrusted) return; // チート対策
            if (!this.classList.contains('up') || this.classList.contains('hit')) return;

            // スコア計算
            updateCombo(combo + 1);
            const points = 10 + (combo * 2);
            score += points;
            
            this.classList.add('hit');
            this.classList.remove('up');
            scoreBoard.textContent = score;

            // ポップアップ表示
            showPopup(e.pageX, e.pageY, `+${points}`);
        }

        function showPopup(x, y, text) {
            const popup = document.createElement('div');
            popup.className = 'score-popup';
            popup.textContent = text;
            popup.style.left = `${x}px`;
            popup.style.top = `${y}px`;
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 500);
        }

        moles.forEach(mole => mole.addEventListener('mousedown', whack));
        moles.forEach(mole => mole.addEventListener('touchstart', (e) => {
            e.preventDefault();
            whack.call(e.target.closest('.mole'), e);
        }));

        startBtn.addEventListener('click', startGame);

    </script>
</body>
</html>
